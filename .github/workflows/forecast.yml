name: Prévisions

# Banc de prévision : PostgreSQL, TimesFM et Timestral, avec les métriques de péage créées et
# approuvées par scripts/seed-forecasts.sh. Les deux modèles doivent répondre pour chaque série.
#
# Le banc est ciblé sur les fichiers ci-dessous : il attend le téléchargement des poids et
# 128 points d’historique avant la première prévision.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - compose.yaml
      - compose.forecast.yaml
      - .env.example
      - compose.forecast-test.yaml
      - scripts/seed-forecasts.sh
      - scripts/test-forecast.ps1
      - scripts/check-forecast-models.py
      - .github/workflows/forecast.yml

permissions:
  contents: read

concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TIMESFM_CPUS: "3.0"
      TIMESFM_THREADS: "3"
      TIMESFM_MEM_LIMIT: 6g
    steps:
      - uses: actions/checkout@v4

      - name: Inférence des deux modèles sur une série synthétique
        shell: pwsh
        run: ./scripts/test-forecast.ps1

      - name: Collecte Kafka, approbation et prévision des trois séries
        shell: pwsh
        run: ./scripts/test-forecast.ps1 -Mode Complet

      - name: Arrêt
        if: always()
        shell: pwsh
        run: ./scripts/test-forecast.ps1 -Arreter
