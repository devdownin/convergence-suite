name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Syntaxe des scripts et des fichiers Compose, pour chaque combinaison de modules.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Royaume Keycloak généré à jour
        run: python3 scripts/build-realm.py --check

      - name: Secrets de test
        run: scripts/init-env.sh

      - name: docker compose config, toutes combinaisons de modules
        run: |
          set -e
          for files in \
            compose.yaml \
            compose.yaml:compose.docs.yaml \
            compose.yaml:compose.monitoring.yaml \
            compose.yaml:compose.auth.yaml \
            compose.yaml:compose.docs.yaml:compose.monitoring.yaml:compose.auth.yaml \
            compose.yaml:compose.docs.yaml:compose.auth.yaml:compose.actions.yaml \
            compose.yaml:compose.auth.yaml:compose.actions.yaml:compose.e2e.yaml
          do
            echo "→ $files"
            COMPOSE_FILE="$files" docker compose config --quiet
          done

      - name: Configuration Caddy
        run: |
          docker run --rm \
            -v "$PWD/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/proxy/sites:/etc/caddy/sites:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Règles Prometheus et collecte
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/upstream/autoroutes/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml

  # Démarre la suite et lance le test de fumée (tâche 1.4), sans puis avec Keycloak : le module auth
  # met le MCP d'Autoroutes sous jeton, et le smoke vérifie alors que l'agent passe avec le sien.
  # Le module docs n'est pas démarré ici : 4,8 Go de modèles et 16 Go de RAM.
  smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        modules: ["compose.yaml", "compose.yaml:compose.auth.yaml", "compose.yaml:compose.auth.yaml:compose.actions.yaml"]
    name: smoke (${{ matrix.modules }})
    steps:
      - uses: actions/checkout@v4

      # smoke.sh relit .env : les modules s'y écrivent, une variable d'environnement du job serait écrasée.
      - name: Secrets de test et modules
        run: |
          scripts/init-env.sh
          sed -i "s|^COMPOSE_FILE=.*|COMPOSE_FILE=${{ matrix.modules }}|" .env

      - name: Récupération des images
        run: docker compose pull --quiet

      - name: Démarrage
        run: docker compose up -d

      - name: Test de fumée
        env:
          SMOKE_TIMEOUT: "420"
        run: scripts/smoke.sh

      - name: État et journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Arrêt
        if: always()
        run: docker compose down -v

  # Boucle complète sur une vraie pile : gare muette → cycle → décision → approbation → action → vérification.
  # Le modèle est factice (e2e/fake-llm.py) : aucune clé, résultat reproductible.
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Secrets de test et modules
        run: |
          scripts/init-env.sh
          sed -i "s|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.auth.yaml:compose.actions.yaml:compose.e2e.yaml|" .env

      - name: TEMPORAIRE — images construites depuis les PR Kex #225 et Autoroutes #61
        run: |
          docker build -q -t compagnonsdudev/kex-agent-ai:e2e https://github.com/devdownin/Kex-anHarness.git#verification-stabilisation
          docker build -q -t compagnonsdudev/autoroutes:simulator-e2e -f simulator/Dockerfile https://github.com/SteelDevAndroid/autoroutes.git#simulateur-gare-muette
          docker build -q -t compagnonsdudev/autoroutes:mcp-anomalies-e2e -f mcp-anomalies/Dockerfile https://github.com/SteelDevAndroid/autoroutes.git#simulateur-gare-muette
          for s in backend frontend; do docker pull -q compagnonsdudev/autoroutes:$s-0.5.3; docker tag compagnonsdudev/autoroutes:$s-0.5.3 compagnonsdudev/autoroutes:$s-e2e; done
          sed -i -e '/^KEX_AGENT_IMAGE_TAG=/d' -e '/^AUTOROUTES_TAG=/d' .env
          printf 'KEX_AGENT_IMAGE_TAG=e2e\nAUTOROUTES_TAG=e2e\n' >> .env

      - name: Récupération des images
        run: docker compose pull --quiet --ignore-pull-failures

      - name: Démarrage
        run: docker compose up -d

      - name: Boucle de bout en bout
        run: scripts/e2e.sh

      - name: État et journaux en cas d'échec
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 80 fake-llm agent autoroutes-mcp autoroutes-simulator

      - name: Arrêt
        if: always()
        run: docker compose down -v

